name: ChatGPT PS1 analysis verification

on:
  push:
    branches:
      - chatgpt/ps1-analysis-recovery-20261103
    paths:
      - .github/workflows/chatgpt-ps1-analysis.yml
      - ps1-analysis-checkpoints/analysis/20261103-town-balance/balance-analysis.py
      - ps1-analysis-checkpoints/analysis/20261103-town-balance/run-ci-verification.py
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: chatgpt-ps1-analysis-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/chatgpt/ps1-analysis-recovery-20261103'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out analysis branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 1
          sparse-checkout: |
            ps1-analysis-checkpoints
      - name: Restore and verify original archive
        run: python3 ps1-analysis-checkpoints/archives/20261103-r2/restore.py --restore "$RUNNER_TEMP/ps1-r2.zip"
      - name: Verify original town-balance instructions
        run: python3 ps1-analysis-checkpoints/analysis/20261103-town-balance/run-ci-verification.py "$RUNNER_TEMP/ps1-r2.zip"
      - name: Commit verification outputs to analysis branch
        if: always()
        run: |
          test "$GITHUB_REF_NAME" = "chatgpt/ps1-analysis-recovery-20261103"
          test -f ps1-analysis-checkpoints/analysis/20261103-town-balance/status.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ps1-analysis-checkpoints/analysis/20261103-town-balance/results ps1-analysis-checkpoints/analysis/20261103-town-balance/status.json ps1-analysis-checkpoints/analysis/20261103-town-balance/README.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Record original PS1 town-balance verification results"
          git push origin "HEAD:$GITHUB_REF_NAME"
