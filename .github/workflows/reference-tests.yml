name: Reference simulation tests

on:
  pull_request:
    paths:
      - 'reference_sim/**'
      - 'game/**'
      - '.github/workflows/reference-tests.yml'
  push:
    branches: [main]
    paths:
      - 'reference_sim/**'
      - 'game/**'
      - '.github/workflows/reference-tests.yml'

jobs:
  reference-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Run reference and production-client contract tests
        working-directory: reference_sim
        run: PYTHONPATH=. python -m unittest discover -s tests -v

  godot-headless-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    container:
      image: barichello/godot-ci:4.3
    steps:
      - uses: actions/checkout@v4
      - name: Import the Godot project and run the vertical-slice smoke test
        run: |
          godot --headless --editor --path game --quit
          godot --headless --path game --script res://scripts/headless_smoke.gd
