name: Native staff regression

on:
  push:
    branches: [chatgpt/ps-ui-touch-audit-20261119]
    paths:
      - 'game/**'
      - '.github/workflows/native-staff-regression.yml'
  pull_request:
    paths:
      - 'game/**'
      - '.github/workflows/native-staff-regression.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-staff:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Install the Android build's Godot version
        run: |
          curl --fail --location --retry 3 -o /tmp/godot.zip https://github.com/godotengine/godot-builds/releases/download/4.6.3-stable/Godot_v4.6.3-stable_linux.x86_64.zip
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x /tmp/godot/Godot_v4.6.3-stable_linux.x86_64
          echo "/tmp/godot" >> "$GITHUB_PATH"
      - name: Import project and check focused native regressions
        shell: bash
        run: |
          set -euo pipefail
          engine=Godot_v4.6.3-stable_linux.x86_64
          timeout 120s "$engine" --headless --editor --path game --quit 2>&1 | tee /tmp/import.log
          if grep -E 'SCRIPT ERROR:|Parse Error:|Compile Error:' /tmp/import.log; then exit 1; fi
          for script in ejection_consistency pending_audio operating_audio live_staff_traits source_people staff_response source_geometry staff_lifecycle annual_personnel annual_personnel_ui town_press; do
            timeout 120s "$engine" --headless --path game --script "res://scripts/${script}_smoke.gd" -- --android-preview 2>&1 | tee "/tmp/${script}.log"
            if grep -E 'SCRIPT ERROR:|Assertion failed|Parse Error:|Compile Error:' "/tmp/${script}.log"; then exit 1; fi
            grep -E '_PASS' "/tmp/${script}.log"
          done
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Check related reference mechanics
        working-directory: reference_sim
        run: |
          python -m pip install pytest
          PYTHONPATH=. python -m pytest -q tests/test_staff_growth.py tests/test_staff_growth_resolution.py tests/test_staff_rest_recovery.py tests/test_staff_rest_timing.py
